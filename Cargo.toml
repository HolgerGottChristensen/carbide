[workspace]
resolver = "2"
members = [
    "carbide_core",
    "carbide_macro",
    "carbide_controls",
    "carbide_derive",
    "carbide_media",
    "carbide_syn",
    "backends/carbide_winit",
    "backends/carbide_wgpu",
    "backends/carbide_wgpu_3d",
    "backends/carbide_windows",
    "backends/carbide_cosmic_text",
    "backends/carbide_printpdf",
    "backends/carbide_lyon",
    "backends/carbide_fluent",
    "examples/lines",
    "examples/hacker_news",
    "examples/calculator",
    "examples/counter",
    "examples/fractal",
    "examples/mandelbrot",
    "examples/othello",
    "examples/drawing_paths_and_shapes",
    "carbide",
    "carbide_3d",
    "carbide_chart",
    "carbide_dialogs",
    "carbide_table",
    "backends/carbide_cache",
    "backends/carbide_usvg", "backends/carbide_icons", "carbide_studio", "backends/carbide_wgpu_core",
    "backends/carbide_tesselation",
]

[workspace.package]
version = "0.72.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/HolgerGottChristensen/carbide.git"
homepage = "https://github.com/HolgerGottChristensen/carbide"
authors = [
    "Holger Gott Christensen"
]

[workspace.dependencies]
accesskit = "0.24.0"
accesskit_winit = "0.32.2"
async-std = "1.13.0"
bitflags = "2.4.0"
block = "0.1.6"
bytemuck = { version = "1.7", features = ["derive", "min_const_generics"] }
carbide_derive = { path = "carbide_derive", version = "0.72.0" }
carbide_macro = { path = "carbide_macro", version = "0.72.0" }
carbide_dialogs = { path = "carbide_dialogs", version = "0.72.0" }
carbide_icons = { path = "backends/carbide_icons", version = "0.72.0" }
carbide_usvg = { path = "backends/carbide_usvg", version = "0.72.0" }
carbide_core = { path = "carbide_core", version = "0.72.0" }
carbide_wgpu = { path = "backends/carbide_wgpu", version = "0.72.0" }
carbide_wgpu_core = { path = "backends/carbide_wgpu_core", version = "0.72.0" }
carbide_tesselation = { path = "backends/carbide_tesselation", version = "0.72.0" }
carbide_lyon = { path = "backends/carbide_lyon", version = "0.72.0" }
carbide_winit = { path = "backends/carbide_winit", version = "0.72.0" }
carbide_controls = { path = "carbide_controls", version = "0.72.0" }
carbide_cosmic_text = { path = "backends/carbide_cosmic_text", version = "0.72.0" }
carbide = { path = "carbide", version = "0.72.0" }
cgmath = { version = "0.18", features = ["mint"] }
chrono = "0.4"
cocoa = "0.24.0"
console_error_panic_hook = "0.1.7"
console_log = "1"
copypasta = "0.8.1"
core-graphics = "0.22.0"
dashmap = "6.1.0"
dyn-clone = "1.0.5"
env_logger = "0.11.7"
foreign-types = "0.3.2"
futures = "0.3"
image = "0.25.5"
image-compare = "0.5.0"
inventory = "0.3.25"
include_dir = "0.7.4"
indexmap = "2.6.0"
log = "0.4"
lyon_for_carbide = "1.0.1"
objc = "0.2.7"
once_cell = "1.19.0"
oneshot = "0.1.3"
parking_lot = "0.12.3"
proc-macro-crate = "3.2.0"
rand = { version = "0.10.0" }
raw-window-handle = "0.5"
reqwest = "0.11.22"
serde_json = "1"
smallvec = "1.13.2"
surf = "2.3"
tokio = "1"
typed-arena = "2.0.2"
url = "2.5.8"
walkdir = "2.4.0"
wasm-bindgen = "0.2.97"
wasm-bindgen-futures = "0.4.45"
web-time = "1.1.0"
wgpu = { version = "25", features = ["fragile-send-sync-non-atomic-wasm"] }
winit = { version = "0.30.13", features = ["rwh_05"] }

