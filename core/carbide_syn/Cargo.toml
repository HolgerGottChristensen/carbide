[package]
name = "carbide_syn"
# version = "2.0.38" # don't forget to update html_root_url and syn.json
version.workspace = true
repository.workspace = true
edition.workspace = true
authors = ["David Tolnay <dtolnay@gmail.com>"]
categories = ["development-tools::procedural-macro-helpers", "parser-implementations"]
description = "Parser for Rust source code"
documentation = "https://docs.rs/syn"
include = [
    "/benches/**",
    "/Cargo.toml",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
    "/src/**",
    "/tests/**",
]
keywords = ["macros", "syn"]
license = "MIT OR Apache-2.0"

[features]
default = ["derive", "parsing", "printing", "clone-impls", "proc-macro"]
derive = []
full = []
parsing = []
printing = ["quote"]
visit = []
visit-mut = []
fold = []
clone-impls = []
extra-traits = []
proc-macro = ["proc-macro2/proc-macro", "quote/proc-macro"]

[dependencies]
proc-macro2 = { workspace = true, default-features = false }
quote = { workspace = true, optional = true, default-features = false }
unicode-ident.workspace = true

[dev-dependencies]
anyhow.workspace = true
automod.workspace = true
flate2.workspace = true
insta.workspace = true
rayon.workspace = true
ref-cast.workspace = true
regex.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
rustversion.workspace = true
tar.workspace = true
termcolor.workspace = true
walkdir.workspace = true

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(doc_cfg)'] }

# Can't use `workspace = true` together with the `[lints.rust]` table above, so the
# workspace's clippy settings are repeated here.
[lints.clippy]
module_inception = "allow"
