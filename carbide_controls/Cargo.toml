[package]
name = "carbide_controls"
version.workspace = true
repository.workspace = true
edition.workspace = true
authors = [
    "Holger Gott Christensen",
]
keywords = ["ui", "widgets", "gui", "interface", "graphics"]
description = "A set of control widgets for the carbide core crate"
license = "MIT OR Apache-2.0"
readme = "../README.md"
categories = ["gui"]
homepage = "https://github.com/HolgerGottChristensen/carbide"

[dependencies]
carbide_macro.workspace = true
carbide_dialogs.workspace = true
carbide_fluent = { workspace = true, optional = true }
carbide_core.workspace = true
copypasta.workspace = true
unicode-segmentation.workspace = true
serde.workspace = true
dyn-clone.workspace = true
chrono.workspace = true
smallvec.workspace = true
indexmap.workspace = true

[dev-dependencies]
env_logger.workspace = true
carbide_wgpu = { workspace = true, features = ["controls", "icons"] }
carbide_icons = { workspace = true, features = ["lucide"] }
futures.workspace = true
assert_matches.workspace = true

[lints]
workspace = true
