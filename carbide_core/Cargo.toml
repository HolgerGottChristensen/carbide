[package]
name = "carbide_core"
version.workspace = true
repository.workspace = true
edition.workspace = true
authors = [
    "Holger Gott Christensen",
]
keywords = ["ui", "widgets", "gui", "interface", "graphics"]
description = "An easy-to-use, 100% Rust, extensible 2D GUI library."
license = "MIT OR Apache-2.0"
readme = "../README.md"
homepage = "https://github.com/HolgerGottChristensen/carbide"
categories = ["gui"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["macro", "open-url"]
macro = ["carbide_macro"]
# Enables ApplicationManager::open_url, which shells out to the OS to open a url/path with
# whatever application is registered for it (default browser, mail client, etc). Opt-out since
# it pulls in the `open` crate.
open-url = ["dep:open"]

[dependencies]
carbide_derive.workspace = true
carbide_macro = { workspace = true, optional = true }
carbide_usvg.workspace = true

bitflags.workspace = true
cgmath.workspace = true
dyn-clone.workspace = true
indexmap.workspace = true
parking_lot.workspace = true
smallvec.workspace = true
url.workspace = true
web-time.workspace = true
dashmap.workspace = true
inventory.workspace = true

accesskit.workspace = true
image.workspace = true
fxhash.workspace = true
futures.workspace = true
oneshot.workspace = true
gif.workspace = true
gif-dispose.workspace = true
open = { workspace = true, optional = true }

async-std = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["full"] }

[lints]
workspace = true
