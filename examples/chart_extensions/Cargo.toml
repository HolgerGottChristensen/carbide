[package]
name = "chart_extensions"
version.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

# Extends carbide's charts from outside, through the `carbide` crate alone, as an application
# would: a coordinate type, a scale and a controller of its own. The snapshot tests in `tests/`
# check that each one works. `main` is a gallery of charts to play with, one at a time, each with
# its options in a side bar; the `extensions` bin shows the crate's own elements in a window, and
# the `interaction` bin plays with the charts' pointer input (both in `src/bin/`). See
# `libraries/carbide_chart/docs/api-review.md`, step 1, for what can't be extended yet.

[dependencies]
carbide = { workspace = true, features = ["chart", "controls", "i18n"] }
chrono.workspace = true

[dev-dependencies]
carbide = { workspace = true, features = ["chart", "controls", "i18n", "testing"] }

[package.metadata.bundle]
name = "Chart Extensions Example - Carbide"
identifier = "rs.carbide.chartextensionsapplication"

[lints]
workspace = true
