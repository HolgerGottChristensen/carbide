[package]
name = "carbide_wgpu"
version.workspace = true
repository.workspace = true
edition.workspace = true
authors.workspace = true
keywords = ["ui", "gui", "interface", "graphics", "wgpu"]
description = "A crate to assist with rendering carbide UIs via wgpu."
license.workspace = true
readme = "../../README.md"
homepage = "https://github.com/HolgerGottChristensen/carbide"
categories = ["gui"]

[features]
default = ["lyon", "cosmic_text", "windowing"]
# Registers carbide_lyon as the tesselator used to render shapes.
lyon = ["dep:carbide_lyon"]
# Registers carbide_cosmic_text as the text context used to lay out and render text.
cosmic_text = ["dep:carbide_cosmic_text"]
icons = ["carbide_icons"]
# Registers a window renderer, so windowing backends such as carbide_winit can render with wgpu.
windowing = ["dep:carbide_windowing"]
# Exposes the headless renderer hooks (carbide_wgpu::testing) that carbide_testing builds on.
testing = ["dep:serde_json"]

[dependencies]
carbide_core.workspace = true
carbide_windowing = { workspace = true, optional = true }
carbide_lyon = { workspace = true, optional = true }
carbide_tesselation.workspace = true
carbide_cosmic_text = { workspace = true, optional = true }
carbide_icons = { workspace = true, optional = true }
carbide_wgpu_core.workspace = true
log.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
#smaa = "0.4.0"
typed-arena.workspace = true
dashmap.workspace = true
image.workspace = true
serde_json = { workspace = true, optional = true }

[dev-dependencies]
carbide_wgpu = { workspace = true, features = ["icons"] }
carbide_winit = { workspace = true, features = ["controls"] }
carbide_icons = { workspace = true, features = ["lucide"] }
carbide_controls.workspace = true
carbide_macro.workspace = true

futures.workspace = true
async-std.workspace = true
reqwest.workspace = true
chrono.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
surf.workspace = true
tokio = { workspace = true, features = ["full"] }

[[test]]
name = "window_renderer_plugin"
required-features = ["windowing"]

[[example]]
name = "async"
required-features = ["carbide_core/async-std"]

[[example]]
name = "async_tokio"
required-features = ["carbide_core/tokio"]

[lints]
workspace = true
