[package]
name = "carbide_usvg"
version.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.87.0"
description = "An SVG simplification library."
categories = ["multimedia::images"]
documentation = "https://docs.rs/usvg/"
readme = "README.md"

[dependencies]
base64.workspace = true # for embedded images
log.workspace = true
strict-num.workspace = true
svgtypes.workspace = true
tiny-skia-path.workspace = true

# parser
data-url.workspace = true # for href parsing
flate2 = { workspace = true, default-features = false, features = ["rust_backend"] } # SVGZ decoding
imagesize.workspace = true # raster images size detection
kurbo.workspace = true # Bezier curves utils
roxmltree.workspace = true
simplecss.workspace = true
siphasher.workspace = true # perfect hash implementation

# text
fontdb = { workspace = true, default-features = false, optional = true }
rustybuzz = { workspace = true, optional = true }
# Note: ttf-parser is re-exported from rustybuzz, but we need gvar-alloc for variable fonts
# with many variation axes (like Roboto Flex which has 13 axes)
ttf-parser = { workspace = true, optional = true, features = ["gvar-alloc"] }
unicode-bidi = { workspace = true, optional = true }
unicode-script = { workspace = true, optional = true }
unicode-vo = { workspace = true, optional = true }

[features]
default = ["text", "system-fonts", "memmap-fonts"]
# Enables text-to-path conversion support.
# Adds around 400KiB to your binary.
text = ["fontdb", "rustybuzz", "ttf-parser", "unicode-bidi", "unicode-script", "unicode-vo"]
# Enables system fonts loading.
system-fonts = ["fontdb/fs", "fontdb/fontconfig"]
# Enables font files memmaping for faster loading.
memmap-fonts = ["fontdb/memmap"]
