[package]
name = "carbide"
version.workspace = true
repository.workspace = true
edition.workspace = true
authors = [
    "Holger Gott Christensen",
]
keywords = ["ui", "widgets", "gui", "interface", "graphics"]
categories = ["gui"]
license = "MIT OR Apache-2.0"
readme = "../README.md"
homepage = "https://github.com/HolgerGottChristensen/carbide"
description = "A crate that includes the other carbide crates and where features can be selected"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["carbide_winit", "carbide_wgpu", "carbide_macro", "carbide_core/tokio"]
controls = ["carbide_controls", "carbide_winit/controls"]
media = ["carbide_media", "icons"]
chart = ["carbide_chart"]
dialogs = ["carbide_dialogs"]
# Also enables the controls' fluent integration, when controls are enabled.
i18n = ["carbide_fluent", "carbide_controls?/carbide_fluent"]
3d = ["carbide_3d", "carbide_wgpu_3d"]
icons = ["carbide_icons", "carbide_wgpu/icons", "carbide_icons/lucide"]
icons_remix = ["icons", "carbide_icons/remix"]
icons_tabler = ["icons", "carbide_icons/tabler"]
table = ["carbide_table"]

[dependencies]
carbide_core.workspace = true
carbide_macro = { workspace = true, optional = true }
carbide_controls = { workspace = true, optional = true }
carbide_winit = { workspace = true, optional = true }
carbide_wgpu = { workspace = true, optional = true }
carbide_3d = { workspace = true, optional = true }
carbide_wgpu_3d = { workspace = true, optional = true }
carbide_media = { workspace = true, optional = true }
carbide_fluent = { workspace = true, optional = true }
carbide_chart = { workspace = true, optional = true }
carbide_dialogs = { workspace = true, optional = true }
carbide_icons = { workspace = true, optional = true }
carbide_table = { workspace = true, optional = true }

[dev-dependencies]
# The examples use these features, so enable them without passing --features.
carbide = { workspace = true, features = ["controls", "icons", "chart", "dialogs", "i18n", "media", "table"] }
reqwest.workspace = true
chrono.workspace = true
rand.workspace = true
copypasta.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["full"] }

# Examples in subfolders aren't discovered by Cargo, so each one is listed here. Examples directly
# in examples/ are still discovered automatically.

